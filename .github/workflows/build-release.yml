name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf curl

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run checks
        run: bash scripts/check.sh

      - name: Build AppImage
        run: bash scripts/build_linux_appimage.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  windows-portable:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Build Windows portable package
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) {
            throw "Visual Studio C++ toolchain을 찾지 못했습니다."
          }

          $devCmd = Join-Path $installPath "Common7\Tools\VsDevCmd.bat"
          cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 && powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_windows.ps1"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-appimage
      - windows-portable
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "My Media Editor ${GITHUB_REF_NAME}"
