name: Build desktop packages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf curl libegl1 libgl1 libpulse0 \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-randr0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run checks
        run: bash scripts/check.sh

      - name: Build AppImage
        run: bash scripts/build_linux_appimage.sh

      - name: Test packaged AppImage
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          app=$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)
          timeout 180 "$app" --self-test --self-test-report "$PWD/linux-package-check.json"
          python3 -c 'import json, sys; sys.exit(0 if json.load(open("linux-package-check.json", encoding="utf-8"))["status"] == "passed" else 1)'

      - name: Upload Linux diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-diagnostics
          path: linux-package-check.json
          if-no-files-found: warn

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  linux-compatibility:
    name: Ubuntu ${{ matrix.os }} compatibility
    needs: linux-appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    steps:
      # Download the exact 22.04 build. Never rebuild on the newer runner.
      - name: Download Ubuntu 22.04 AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: package

      - name: Install desktop runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libpulse0 libfontconfig1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 \
            fonts-dejavu-core xvfb xauth

      - name: Check the same package offscreen and over X11
        timeout-minutes: 8
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          app=$(find "$PWD/package" -maxdepth 1 -name '*.AppImage' -print -quit)
          chmod +x "$app"
          sha256sum "$app" | tee package-sha256.txt
          "$app" --appimage-extract > /dev/null
          test -e squashfs-root/usr/lib/libxcb-cursor.so.0
          rm -rf squashfs-root
          QT_QPA_PLATFORM=offscreen timeout 180 "$app" --self-test --self-test-report "$PWD/offscreen-check.json"
          xvfb-run -a env QT_QPA_PLATFORM=xcb timeout 180 "$app" --self-test --self-test-report "$PWD/x11-check.json"
          python3 -c 'import json, sys; sys.exit(0 if all(json.load(open(name, encoding="utf-8"))["status"] == "passed" for name in ("offscreen-check.json", "x11-check.json")) else 1)'

      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.os }}
          path: |
            package-sha256.txt
            offscreen-check.json
            x11-check.json
          if-no-files-found: warn

  windows-portable:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Build Windows portable package
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) {
            throw "Visual Studio C++ toolchain을 찾지 못했습니다."
          }

          $devCmd = Join-Path $installPath "Common7\Tools\VsDevCmd.bat"
          cmd.exe /d /s /c "`"$devCmd`" -no_logo -arch=x64 && powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_windows.ps1"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Test extracted Windows ZIP
        timeout-minutes: 5
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          $testDir = Join-Path $env:RUNNER_TEMP "Media Editor 검증"
          Expand-Archive $zip.FullName $testDir
          $report = Join-Path $env:GITHUB_WORKSPACE "windows-package-check.json"
          $app = Join-Path $testDir "MyMediaEditor.exe"
          $process = Start-Process -FilePath $app -ArgumentList @("--self-test", "--self-test-report", "`"$report`"") -PassThru -NoNewWindow
          if (-not $process.WaitForExit(180000)) {
            taskkill /PID $process.Id /T /F
            throw "Packaged self-test timed out"
          }
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed: $($process.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne "passed") { throw "Packaged self-test did not pass" }

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          path: windows-package-check.json
          if-no-files-found: warn

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  latest-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    needs:
      - linux-appimage
      - linux-compatibility
      - windows-portable
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*-x*"
          merge-multiple: true

      - name: Publish latest desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest \
            --repo "${GITHUB_REPOSITORY}" \
            --cleanup-tag \
            --yes || true
          gh release create app-latest \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Latest desktop app" \
            --notes "Latest successful desktop build from main."

  github-release:
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs:
      - linux-appimage
      - linux-compatibility
      - windows-portable
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*-x*"
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "My Media Editor ${GITHUB_REF_NAME}"
