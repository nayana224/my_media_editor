[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-editor"
version = "0.1.2"
description = "A lightweight desktop image and video editor for Ubuntu and Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6==6.11.1",
  "imageio-ffmpeg==0.6.0",
]

[project.scripts]
media-editor = "media_editor.bootstrap:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
