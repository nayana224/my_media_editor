[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-editor"
version = "0.1.0"
description = "A lightweight desktop image and video editor for Ubuntu"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.8,<7",
]

[project.scripts]
media-editor = "media_editor.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
